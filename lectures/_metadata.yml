# Shared front matter for every lecture. A deck's own front matter overrides
# anything set here.
#
# Relative paths below are resolved from the *document* (lectures/<slug>/index.qmd),
# not from this file — hence ../../templates/.
author: "Landman Bester"
date: today

format:
  revealjs:
    theme: [dark, ../../templates/dark-academic.scss, ../../templates/lectures.scss]
    template-partials:
      - ../../templates/title-slide.html
    slide-number: true
    code-line-numbers: false
    code-copy: true
    highlight-style: monokai
    center: true
    transition: slide
    mermaid-format: svg
    css: custom.css
    title-slide-attributes:
      data-background-image: images/meerkat-milkyway.jpg
      data-background-opacity: "0.5"

# Institutional logos, rendered as a strip on the title slide by
# templates/title-slide.html. Paths are project-root-relative; Quarto rewrites
# them and copies the files via the `resources:` block in _quarto.yml.
logos:
  # - /assets/logos/nrf.png     # uncomment once the file exists
  - /assets/logos/sarao_logo.jpg
  - /assets/logos/rhodes_banner.jpg
